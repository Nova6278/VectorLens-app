<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <title>VectorLens AR</title>
    
    <link rel="manifest" href="metadata.json" />
    <link rel="icon" type="image/jpeg" href="logo.jpg" />
    
    <script>
      /**
       * CRITICAL: Environment Shim
       */
      window.process = {
        env: {
          API_KEY: "" 
        },
        browser: true
      };
      
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }

      window.onerror = function(msg, url, lineNo, columnNo, error) {
        console.error("Critical Startup Error:", msg, error);
        const errorContainer = document.getElementById('critical-error');
        if (errorContainer) {
          errorContainer.style.display = 'flex';
          const textEl = document.getElementById('error-text');
          if (textEl) textEl.textContent = msg;
        }
        return false;
      };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html, body {
        overscroll-behavior-y: none;
        background-color: #0f172a;
        position: fixed;
        overflow: hidden;
        width: 100%;
        height: 100%;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        margin: 0;
        padding: 0;
      }
      #root { 
        width: 100%; 
        height: 100%; 
        contain: layout size;
      }
      
      #app-shell-loader {
        position: fixed;
        inset: 0;
        background: #0f172a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .loader-logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: linear-gradient(135deg, #6366f1, #a855f7);
        margin-bottom: 20px;
        animation: pulse 2s infinite;
        box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      #critical-error {
        display: none;
        position: fixed;
        inset: 0;
        background: #0f172a;
        color: #ef4444;
        padding: 40px;
        z-index: 10000;
        font-family: sans-serif;
        text-align: center;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="critical-error">
        <h2 style="font-weight: 900; font-size: 24px; margin-bottom: 10px;">Startup Error</h2>
        <p id="error-text" style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">The application failed to initialize.</p>
        <button onclick="location.reload()" style="background: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold;">Retry Boot</button>
    </div>

    <div id="app-shell-loader">
        <div class="loader-logo"></div>
        <div style="color: white; font-family: sans-serif; font-weight: 800; letter-spacing: 0.2em; font-size: 10px; text-transform: uppercase; opacity: 0.6;">Initializing VectorLens</div>
    </div>
    
    <div id="root"></div>

    <script type="module" src="index.tsx"></script>

    <script>
      window.addEventListener('vectorlens-ready', () => {
        const loader = document.getElementById('app-shell-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }
      });

      setTimeout(() => {
        const loader = document.getElementById('app-shell-loader');
        if (loader && loader.style.opacity !== '0') {
           loader.style.opacity = '0';
           setTimeout(() => loader.remove(), 400);
        }
      }, 8000);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
